name: build

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:

# The release job creates/updates a GitHub Release with the built installers.
permissions:
  contents: write

jobs:
  test:
    name: Engine self-test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Runtime provisioning engine
        run: node provision.js --selftest
      - name: Self-update engine
        run: node updater.js --selftest

  package:
    name: Package Windows installers
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build NSIS installer + portable exe
        # `--publish never` keeps electron-builder from implicitly publishing on
        # tag pushes (it would demand GH_TOKEN); the release step below owns that.
        run: npm run dist
      - name: Generate SHA-256 checksums
        shell: pwsh
        run: |
          Get-ChildItem release/DeepSeek-Harness-Desktop-*.exe | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)" | Set-Content -Encoding ascii "$($_.FullName).sha256"
            Write-Host "$($_.Name) $hash"
          }
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-installers
          path: |
            release/DeepSeek-Harness-Desktop-Setup-*.exe
            release/DeepSeek-Harness-Desktop-Setup-*.exe.blockmap
            release/DeepSeek-Harness-Desktop-Setup-*.exe.sha256
            release/DeepSeek-Harness-Desktop-Portable-*.exe
            release/DeepSeek-Harness-Desktop-Portable-*.exe.sha256
            release/builder-effective-config.yaml
      - name: Publish GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/DeepSeek-Harness-Desktop-Setup-*.exe
            release/DeepSeek-Harness-Desktop-Setup-*.exe.blockmap
            release/DeepSeek-Harness-Desktop-Setup-*.exe.sha256
            release/DeepSeek-Harness-Desktop-Portable-*.exe
            release/DeepSeek-Harness-Desktop-Portable-*.exe.sha256
          generate_release_notes: true
          body: |
            Desktop shell for the DeepSeek Harness Web GUI — Windows x64.

            | Asset | Use |
            |---|---|
            | `DeepSeek-Harness-Desktop-Setup-*.exe` | Recommended. Per-user installer; **installed apps update themselves** from this release |
            | `DeepSeek-Harness-Desktop-Portable-*.exe` | No install; portable builds cannot self-update (they download and verify the installer for you) |
            | `*.sha256` | Checksums, verified automatically by the in-app updater |

            First run provisions the runtime automatically (portable Node + a pinned deepseek-harness checkout, with CN mirrors and a resume-friendly wizard). Existing installs: **Tray → Check for updates…**, or wait for the startup check.
